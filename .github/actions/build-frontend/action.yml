name: Build frontend assets
description: Build Glitter's bundle, reusing a cached build when the sources are unchanged

runs:
  using: composite
  steps:
    - name: Restore cached bundle
      id: cache
      uses: actions/cache@v6
      with:
        path: interfaces/Glitter/templates/static/bundle
        key: frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.js', 'frontend/src/**') }}
    - name: Set up Node
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: frontend/.nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Build
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        npm run build
